services:
  app:
    build: .
    container_name: jellyfin-discord-activity
    env_file: .env
    environment:
      # Writable log directory inside the container (host: ./logs/app)
      LOG_DIR: /logs
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./logs/app:/logs
    ports:
      - "3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        tag: "{{.Name}}"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: jellyfin-watch-caddy
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./logs/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        tag: "{{.Name}}"
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
